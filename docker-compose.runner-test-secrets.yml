# Optional: Mandate's test credentials for journeys, read-only, into the sandbox only.
# Added by the Makefile when MANDATE_RUNNER_TEST_SECRETS=1 (off by default).
# Only ~/.mandate/secrets/test/ goes here; ~/.mandate/secrets/build/ never does.

services:
  mandate-runner-dind:
    volumes:
      - ${HOME}/.mandate/secrets/test:/secrets/test:ro

  mandate-runner:
    environment:
      MANDATE_RUNNER_TEST_SECRETS: "1"
