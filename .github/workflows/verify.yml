name: verify
# Builds the exact commit into a clean environment, runs the protected test set and signs the
# evidence bundle with an artifact attestation. Mandate accepts the bundle only when this
# workflow, at its pinned tag, is the signer.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to verify
        required: true
        type: string
      test-set:
        description: Space-separated paths of the protected test set fixed at spec sign-off
        required: false
        default: tests/unit
        type: string
      quarantine:
        description: Space-separated test node ids quarantined on the record
        required: false
        default: ""
        type: string
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          clean: true
      - name: Check out exactly the requested commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the commit into a clean environment
        run: make setup
      - name: Run the protected test set
        env:
          TEST_SET: ${{ inputs.test-set }}
          QUARANTINE: ${{ inputs.quarantine }}
        run: |
          mkdir -p evidence
          deselect=""
          for node in $QUARANTINE; do deselect="$deselect --deselect $node"; done
          set +e
          # shellcheck disable=SC2086
          .venv/bin/python -m pytest $TEST_SET $deselect --junitxml=evidence/junit.xml -q
          echo "$?" > evidence/pytest-exit-code.txt
          exit 0
      - name: Write the report, environment manifest and commit binding
        env:
          COMMIT: ${{ inputs.commit }}
          TEST_SET: ${{ inputs.test-set }}
          QUARANTINE: ${{ inputs.quarantine }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, platform, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          ev = Path("evidence")

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          suite = ET.parse(ev / "junit.xml").getroot()
          if suite.tag == "testsuites":
              suite = suite[0]
          total = int(suite.get("tests", "0"))
          failed = int(suite.get("failures", "0")) + int(suite.get("errors", "0"))
          skipped = int(suite.get("skipped", "0"))
          (ev / "report.json").write_text(json.dumps({
              "tests": total, "failed": failed, "skipped": skipped,
              "passed": total - failed - skipped,
              "pytest_exit_code": int((ev / "pytest-exit-code.txt").read_text()),
              "junit": "junit.xml",
          }, indent=2, sort_keys=True))

          freeze = subprocess.run([".venv/bin/python", "-m", "pip", "freeze"],
                                  capture_output=True, text=True, check=True).stdout
          (ev / "environment.json").write_text(json.dumps({
              "runner_image": os.environ.get("ImageOS", "") + " " + os.environ.get("ImageVersion", ""),
              "os": platform.platform(),
              "python": platform.python_version(),
              "packages": sorted(freeze.splitlines()),
              "packages_sha256": hashlib.sha256(freeze.encode()).hexdigest(),
          }, indent=2, sort_keys=True))

          # The protected test set digest: sha256 over each file's path and content hash,
          # sorted by path.
          files = []
          for root in os.environ["TEST_SET"].split():
              p = Path(root)
              files += [p] if p.is_file() else sorted(q for q in p.rglob("*") if q.is_file()
                                                       and "__pycache__" not in q.parts)
          lines = sorted(f"{f.as_posix()} {sha(f)}" for f in files)
          digest = hashlib.sha256("\n".join(lines).encode()).hexdigest()

          artifacts = {name: sha(ev / name)
                       for name in ("report.json", "environment.json", "junit.xml")}
          (ev / "binding.json").write_text(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["COMMIT"],
              "test_set": os.environ["TEST_SET"].split(),
              "test_set_digest": digest,
              "quarantine": os.environ["QUARANTINE"].split(),
              "artifacts": artifacts,
              "run_id": os.environ["GITHUB_RUN_ID"],
          }, indent=2, sort_keys=True))
          PY
          rm evidence/pytest-exit-code.txt
          tar -czf evidence.tgz evidence
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: evidence.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence.tgz
