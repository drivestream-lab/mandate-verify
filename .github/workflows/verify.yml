name: verify
# Builds the exact commit into a clean environment, runs the protected test set and signs the
# evidence bundle with an artifact attestation. Two jobs, so the code under test never shares
# a job with the signing identity:
#   test    contents: read only. Runs the target repo's code (make setup, pytest) and uploads
#           raw outputs. It has no OIDC token and cannot attest.
#   attest  the only job with id-token and attestations write. Runs no code from the target
#           repo: it recomputes the test-set digest from git objects, builds the binding from
#           the raw outputs, attests the bundle, and fails when the result is not a pass.
# Mandate accepts a bundle only when this workflow, at its pinned tag, is the signer. The
# bundle format and the digest format are documented in README.md.
on:
  workflow_call:
    inputs:
      commit:
        description: The full 40-character commit to verify
        required: true
        type: string
      test-set:
        description: Space-separated tracked paths (files or directories) of the protected test set
        required: false
        default: tests/unit
        type: string
      quarantine:
        description: Space-separated pytest node ids quarantined on the record (each contains ::)
        required: false
        default: ""
        type: string
      plugins:
        description: Space-separated pytest plugin modules to load, for example pytest_asyncio
        required: false
        default: ""
        type: string
permissions: {}
concurrency:
  group: verify-${{ github.repository }}-${{ inputs.commit }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMMIT: ${{ inputs.commit }}
      TEST_SET: ${{ inputs.test-set }}
      QUARANTINE: ${{ inputs.quarantine }}
      PLUGINS: ${{ inputs.plugins }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate the inputs
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex characters"; exit 1; }
          [[ -n "${TEST_SET// /}" ]] || { echo "test-set is empty"; exit 1; }
          for tok in $TEST_SET; do
            [[ "$tok" =~ ^[A-Za-z0-9._/-]+$ && "$tok" != -* && "$tok" != /* && "/$tok/" != */../* ]] \
              || { echo "test-set token is not a plain relative path: $tok"; exit 1; }
          done
          for id in $QUARANTINE; do
            [[ "$id" == *::* && "$id" != -* ]] || { echo "quarantine id needs :: : $id"; exit 1; }
          done
          for mod in $PLUGINS; do
            [[ "$mod" =~ ^[A-Za-z0-9_]+$ ]] || { echo "bad plugin module: $mod"; exit 1; }
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          clean: true
      - name: Check the checkout and that every test-set path is tracked at the commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          for tok in $TEST_SET; do
            n=$(git ls-tree -r --name-only -z "$COMMIT" -- "$tok" | tr -cd '\0' | wc -c)
            [[ "$n" -gt 0 ]] || { echo "not a tracked path at the commit: $tok"; exit 1; }
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the commit into a clean environment
        run: make setup
      - name: Collect, run the protected test set and record the raw outputs
        run: |
          set -u +e -o pipefail
          RAW="$RUNNER_TEMP/raw"; mkdir -p "$RAW"
          cfg="$RUNNER_TEMP/verify-pytest.ini"
          printf '[pytest]\npythonpath = .\n' > "$cfg"
          read -ra tokens <<< "$TEST_SET"
          opts=(-c "$cfg" --rootdir "$PWD" -o addopts= -p no:cacheprovider)
          for mod in $PLUGINS; do opts+=(-p "$mod"); done
          [[ " $PLUGINS " == *" pytest_asyncio "* ]] && opts+=(-o asyncio_mode=auto)
          .venv/bin/python -m pytest --collect-only -q "${opts[@]}" -- "${tokens[@]}" > "$RAW/collect.out" 2>&1
          echo "$?" > "$RAW/collect-exit-code.txt"
          grep -F '::' "$RAW/collect.out" | grep -v '^ ' > "$RAW/collected.txt" || : > "$RAW/collected.txt"
          # --deselect matches by prefix, so every quarantine id must be an exact collected id
          # and no other collected id may start with it.
          deselect=()
          for id in $QUARANTINE; do
            grep -Fxq -- "$id" "$RAW/collected.txt" || { echo "quarantine id is not a collected test: $id"; exit 1; }
            [[ "$(grep -c -F -- "$id" "$RAW/collected.txt")" -eq 1 ]] || { echo "quarantine id is a prefix of another test: $id"; exit 1; }
            deselect+=(--deselect "$id")
          done
          printf '%s\n' $QUARANTINE > "$RAW/quarantine.txt"
          .venv/bin/python -m pytest -q "${opts[@]}" "${deselect[@]}" --junitxml="$RAW/junit.xml" -- "${tokens[@]}"
          echo "$?" > "$RAW/pytest-exit-code.txt"
          git diff --exit-code > /dev/null 2>&1; diff_rc=$?
          git status --porcelain --untracked-files=all -- . ':(exclude).venv' > "$RUNNER_TEMP/status.txt"
          sed 's/^/worktree not clean: /' "$RUNNER_TEMP/status.txt" | head -20
          untracked=$(wc -l < "$RUNNER_TEMP/status.txt")
          if [[ "$diff_rc" -eq 0 && "$untracked" -eq 0 ]]; then echo true; else echo false; fi > "$RAW/worktree-clean.txt"
          python3 -I - "$RAW/environment.json" <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          freeze = subprocess.run([".venv/bin/python", "-m", "pip", "freeze"],
                                  capture_output=True, text=True, check=True).stdout
          json.dump({
              "runner_image": (os.environ.get("ImageOS", "") + " " + os.environ.get("ImageVersion", "")).strip(),
              "os": platform.platform(),
              "python": platform.python_version(),
              "packages": sorted(freeze.splitlines()),
              "packages_sha256": hashlib.sha256(freeze.encode()).hexdigest(),
              "services": "not recorded: service versions and seeded data are deferred until a target needs services",
          }, open(sys.argv[1], "w"), indent=2, sort_keys=True)
          PY
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-${{ inputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw
          if-no-files-found: error
  attest:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ inputs.commit }}
      TEST_SET: ${{ inputs.test-set }}
      QUARANTINE: ${{ inputs.quarantine }}
      PLUGINS: ${{ inputs.plugins }}
      CALLER_REPOSITORY: ${{ github.repository }}
      CALLER_SHA: ${{ github.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Validate the inputs
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex characters"; exit 1; }
          [[ -n "${TEST_SET// /}" ]] || { echo "test-set is empty"; exit 1; }
          for tok in $TEST_SET; do
            [[ "$tok" =~ ^[A-Za-z0-9._/-]+$ && "$tok" != -* && "$tok" != /* && "/$tok/" != */../* ]] \
              || { echo "test-set token is not a plain relative path: $tok"; exit 1; }
          done
          for id in $QUARANTINE; do
            [[ "$id" == *::* && "$id" != -* ]] || { echo "quarantine id needs :: : $id"; exit 1; }
          done
          for mod in $PLUGINS; do
            [[ "$mod" =~ ^[A-Za-z0-9_]+$ ]] || { echo "bad plugin module: $mod"; exit 1; }
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: raw-${{ inputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw
      - name: Build the evidence bundle from git objects and the raw outputs
        run: |
          set -euo pipefail
          mkdir -p evidence-out
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          commit = os.environ["COMMIT"]
          raw = Path(os.environ["RUNNER_TEMP"]) / "raw"
          out = Path("evidence-out")
          if (raw / "junit.xml").stat().st_size > 20_000_000:
              raise SystemExit("junit.xml is too large")
          if subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True,
                            check=True).stdout.strip() != commit:
              raise SystemExit("checkout is not the requested commit")

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, check=True).stdout

          def tree(*paths):
              cmd = ["ls-tree", "-r", "-z", commit] + (["--", *paths] if paths else [])
              entries = {}
              for rec in git(*cmd).split(b"\0"):
                  if not rec:
                      continue
                  meta, path = rec.split(b"\t", 1)
                  mode, kind, sha = meta.decode().split(" ")
                  entries[path] = (mode, sha)
              return entries

          # Digest inputs: every tracked blob under the test-set paths, every conftest.py in
          # the commit, and the root pytest configuration files. See README.md.
          chosen = tree(*os.environ["TEST_SET"].split())
          if not chosen:
              raise SystemExit("test-set matches no tracked file")
          for path, entry in tree().items():
              name = path.rsplit(b"/", 1)[-1]
              if name == b"conftest.py" or path in (b"pytest.ini", b"pyproject.toml",
                                                    b"setup.cfg", b"tox.ini"):
                  chosen[path] = entry
          lines = []
          for path in sorted(chosen):
              mode, sha = chosen[path]
              if mode not in ("100644", "100755") or b"\n" in path:
                  raise SystemExit(f"unsupported entry in the digest inputs: {path!r}")
              lines.append(f"{hashlib.sha256(git('cat-file', 'blob', sha)).hexdigest()}  "
                           f"{path.decode()}\n")
          inputs_text = "".join(lines)
          (out / "digest-inputs.txt").write_text(inputs_text)
          digest = hashlib.sha256(inputs_text.encode()).hexdigest()

          collected = (raw / "collected.txt").read_text().split("\n")
          collected = [c for c in collected if c]
          quarantine = [q for q in (raw / "quarantine.txt").read_text().split("\n") if q]
          if set(quarantine) != set(os.environ["QUARANTINE"].split()) or \
                  not set(quarantine) <= set(collected):
              raise SystemExit("quarantine does not match the collected tests")
          expected = len(collected) - len(quarantine)

          root = ET.parse(raw / "junit.xml").getroot()
          suites = list(root) if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", "0")) for s in suites)
          failures = sum(int(s.get("failures", "0")) for s in suites)
          errors = sum(int(s.get("errors", "0")) for s in suites)
          skipped = sum(int(s.get("skipped", "0")) for s in suites)
          exit_code = int((raw / "pytest-exit-code.txt").read_text())
          collect_exit = int((raw / "collect-exit-code.txt").read_text())
          clean = (raw / "worktree-clean.txt").read_text().strip() == "true"
          result = "pass" if (exit_code == 0 and collect_exit == 0 and total > 0
                              and failures + errors == 0 and total == expected) else "fail"
          report = {
              "result": result, "tests": total, "failures": failures, "errors": errors,
              "skipped": skipped, "pytest_exit_code": exit_code,
              "collect_exit_code": collect_exit, "collected": len(collected),
              "deselected": len(quarantine), "expected_tests": expected,
              "worktree_clean": clean,
          }
          env = json.loads((raw / "environment.json").read_text())
          (out / "report.json").write_text(json.dumps(report, indent=2, sort_keys=True))
          (out / "environment.json").write_text(json.dumps(env, indent=2, sort_keys=True))
          (out / "junit.xml").write_bytes((raw / "junit.xml").read_bytes())
          (out / "collected.txt").write_text("".join(c + "\n" for c in collected))
          names = ("report.json", "environment.json", "junit.xml", "collected.txt",
                   "digest-inputs.txt")
          (out / "binding.json").write_text(json.dumps({
              "repository": os.environ["CALLER_REPOSITORY"],
              "commit": commit,
              "caller_sha": os.environ["CALLER_SHA"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "event_name": os.environ["EVENT_NAME"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "test_set": os.environ["TEST_SET"].split(),
              "test_set_digest": digest,
              "quarantine": quarantine,
              "plugins": os.environ["PLUGINS"].split(),
              "result": result,
              "artifacts": {n: hashlib.sha256((out / n).read_bytes()).hexdigest() for n in names},
          }, indent=2, sort_keys=True))
          PY
          tar -czf evidence.tgz -C evidence-out binding.json report.json environment.json junit.xml collected.txt digest-inputs.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: evidence.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ inputs.commit }}-${{ github.run_attempt }}
          path: evidence.tgz
          if-no-files-found: error
      - name: Fail unless the protected test set passed
        run: |
          python3 -I -c 'import json,sys; r=json.load(open("evidence-out/report.json")); print(r); sys.exit(0 if r["result"]=="pass" else 1)'
